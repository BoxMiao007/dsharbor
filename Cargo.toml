# 工作区：纯逻辑核心库 + Tauri 外壳
# 核心库与界面解耦，保证不依赖系统 API 也能 `cargo test` 直接验证。
[workspace]
resolver = "2"
members = ["crates/dsharbor-core", "src-tauri"]

[workspace.package]
version = "0.3.4"
edition = "2021"
rust-version = "1.77.2"
license = "MIT"
repository = "https://github.com/BoxMiao007/dsharbor"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
# 构建速度优先：fat LTO + codegen-units = 1 会把收尾编译串成单核
# （实测重编壳 + LTO + 链接要 3 分钟），换 thin LTO + 每 crate 16 个
# codegen 单元，让多核用起来；strip 只影响产物体积，保留。
lto = "thin"
codegen-units = 16
strip = true
