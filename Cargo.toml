# 工作区：纯逻辑核心库 + Tauri 外壳
# 核心库与界面解耦，保证不依赖系统 API 也能 `cargo test` 直接验证。
[workspace]
resolver = "2"
members = ["crates/dsharbor-core", "src-tauri"]

[workspace.package]
version = "0.9.1"
edition = "2021"
rust-version = "1.77.2"
license = "MIT"
repository = "https://github.com/BoxMiao007/dsharbor"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
# preserve_order：改写环境 package.json（组合包开关）时保持原有键序，不做无谓重排。
serde_json = { version = "1", features = ["preserve_order"] }

[profile.release]
# 默认「速度优先」，供本地测试用：fat LTO + codegen-units = 1 会把收尾
# 编译串成单核（实测重编壳 + LTO + 链接要 3 分钟），换 thin LTO + 每
# crate 16 个 codegen 单元，让多核用起来；strip 只影响产物体积，保留。
# 发布 GitHub 的安装包必须用「性能优先」构建，在本 profile 之上用环境
# 变量覆盖（不改本文件）：CARGO_PROFILE_RELEASE_LTO=true
# CARGO_PROFILE_RELEASE_CODEGEN_UNITS=1，见 AGENTS.md「发布」一节。
lto = "thin"
codegen-units = 16
strip = true
