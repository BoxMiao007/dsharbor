<!doctype html>
<html lang="zh-CN" data-mode="dark">
  <head>
    <meta charset="utf-8" />
    <title>候选乙改 · 上下两卡 + 左侧导航</title>
    <link rel="stylesheet" href="./common.css" />
    <link rel="stylesheet" href="./d-rail-panel.css" />
  </head>
  <body>
    <div class="frame">
      <div class="titlebar" data-tauri-drag-region>
        <span class="brand"><img src="../../../src/assets/logo.png" alt="" />DSHarbor</span>
        <div class="tb-right">
          <button class="mode-btn" id="mode-btn" aria-label="切换深浅色"></button>
          <button class="win-btn" aria-label="最小化">
            <svg viewBox="0 0 10 10"><path d="M0.5 5h9" /></svg>
          </button>
          <button class="win-btn" aria-label="最大化">
            <svg viewBox="0 0 10 10"><rect x="0.6" y="0.6" width="8.8" height="8.8" rx="1.4" /></svg>
          </button>
          <button class="win-btn" aria-label="关闭">
            <svg viewBox="0 0 10 10"><path d="M1 1 9 9M9 1 1 9" /></svg>
          </button>
        </div>
      </div>

      <section class="card top-card">
        <div class="head-line">
          <img class="head-logo" src="../../../src/assets/logo.png" alt="" />
          <div class="head-text">
            <h1>DSHarbor</h1>
            <p>DSH Web 的桌面壳</p>
          </div>
          <div class="badges">
            <span class="badge on"><i class="dot"></i>登录链接就绪</span>
            <span class="badge on"><i class="dot"></i>运行中</span>
            <span class="badge">DSH 0.2.1-rc.2</span>
            <span class="meta">PID <b>12844</b></span>
            <span class="meta">监听 <b>3080</b></span>
          </div>
        </div>

        <div class="tool-row">
          <span class="tip">登录链接：<b>http://127.0.0.1:3080/?token=••••</b></span>
          <div class="actions">
            <button class="btn primary">停止 DSH</button>
            <button class="btn">重启 DSH</button>
            <button class="btn">应用内打开</button>
            <button class="btn">浏览器打开</button>
          </div>
        </div>
      </section>

      <section class="card main-card">
        <div class="card-body">
          <nav class="rail" id="nav" aria-label="设置分区"></nav>
          <section class="panel">
            <div class="panel-head">
              <span class="p-ico" id="p-ico"></span>
              <h2 id="p-title"></h2>
              <span class="p-note">改动立即保存</span>
            </div>
            <div class="panel-body" id="p-body"></div>
          </section>
        </div>

        <p class="foot">关闭窗口 = 轻量模式：界面内存释放，DSH 与托盘常驻。</p>
      </section>
    </div>

    <div class="cand-bar">候选乙改 · 上下两卡 + 左侧导航 · <a href="./index.html">回挑选页</a></div>

    <script src="./common.js"></script>
    <script src="./d-rail-panel.js"></script>
    <script>
      initRailPanel();
    </script>
  </body>
</html>
