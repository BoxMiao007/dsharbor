<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>DSHarbor</title>
    <style>
      /* 首帧预着色：页面加载到 main.ts 挂上界面还有一段空窗，那段时间先按
         <html data-mode> 把底色铺好，否则深色下会先闪一帧亮底。
         这份底色有三处副本，必须同值（行号会漂，认符号名）：
           1. 本文件下面的 html[data-mode] 规则；
           2. src/styles/00-tokens.css 里 --bg（深色在 :85、浅色在 :145）；
           3. src-tauri/src/lib.rs 的 webview_base_color()（当前 :907-915）。
         改色三处一起改，否则冷启动/托盘重建窗口时会闪一帧另一种底色。 */
      html[data-mode="dark"] {
        background: #101114;
      }

      html[data-mode="light"] {
        background: #f2f3f5;
      }
    </style>
    <script>
      // 外观存在 WebView 的 localStorage，页面一进来就同步挂上 data-mode，
      // 让上面的预着色规则即刻生效。存储键与取值是 src/main.ts 里
      // THEME_KEY / ThemeId 的复写（这里是纯静态内联脚本，没法 import），
      // 改键名或取值必须两处同步。读不到（隐私模式 / 首次启动）按深色走，
      // 与 main.ts 的默认值一致。
      try {
        var storedMode = localStorage.getItem("dsharbor.ui.theme");
        // 旧版的 nativeDark / native 都是深色，迁移时按深色处理。
        var dark = storedMode !== "light";
        document.documentElement.dataset.mode = dark ? "dark" : "light";
      } catch (err) {
        /* 读不到就按深色走 */
      }
    </script>
    <script>
      // 动效偏好同样存在 localStorage：首帧就同步读一次并贴属性，避免界面先动起来
      // 再被 main.ts 关掉（会闪一下）。键名与取值是 src/ui/motion.ts 里
      // MOTION_KEY / MotionPref 的复写（静态内联脚本没法 import），
      // 改键名或取值必须两处同步。只在明确存了 "off" 时写属性，其余（没存过、
      // 读坏、存储被禁用）都按「开」走，与 main.ts 的默认值一致。
      try {
        if (localStorage.getItem("dsharbor.ui.motion") === "off") {
          document.documentElement.dataset.motion = "off";
        }
      } catch (err) {
        /* 读不到就按「开」走，不写属性 */
      }
    </script>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
