[package]
name = "dsharbor"
description = "DSH Web 的轻量桌面壳（Tauri 2 外壳）"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
# 仓库地址：界面「关于」卡片的「打开 GitHub 仓库」按它打开（单一来源）。
repository.workspace = true

# 桌面壳同时产出可执行文件与（给移动端/Rust 侧复用的）库。
# 库名带 _lib 后缀是 Tauri 模板惯例，避免与二进制同名冲突。
[lib]
name = "dsharbor_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
# 单实例：重复启动时切回已有实例（官方插件，Windows 上经命名互斥体实现）。
tauri-plugin-single-instance = "2"
# 文件对话框：「指定程序路径」的「浏览…」按钮（官方插件，Windows 上弹系统「打开文件」框）。
tauri-plugin-dialog = "2"
serde = { workspace = true }
serde_json = "1"
dsharbor-core = { path = "../crates/dsharbor-core" }
